<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srovnání pojištění – Sestava k tisku</title>
    <script src="insurance-data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* A4 landscape inner area at 12mm margin = 273×186mm */
            --page-w: 273mm;
            --page-h: 186mm;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0;
            color: #0f172a;
            margin: 0;
            padding: 16px;
            font-size: 10px;
            line-height: 1.4;
        }

        /* Toolbar je teď NORMÁLNÍ block element NAD print obsahem (ne fixed popup).
           Tím nezakrývá obsah a chová se předvídatelněji. */
        .toolbar {
            max-width: 1120px;
            margin: 12px auto 16px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(15,23,42,.08);
        }
        .toolbar fieldset { flex: 1 1 auto; min-width: 0; }
        .toolbar-row {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar button {
            font-size: 11px;
            font-weight: 600;
            padding: 7px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: #ffffff;
            color: #0f172a;
            cursor: pointer;
        }
        .toolbar button:hover { background: #f1f5f9; }
        .toolbar button.primary { background: #0284c7; color: white; border-color: #0284c7; }
        .toolbar button.primary:hover { background: #0369a1; }
        .toolbar label {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 10px; color: #475569;
        }
        .toolbar select {
            font-size: 10px; padding: 5px 6px; border: 1px solid #cbd5e1;
            border-radius: 4px; background: #ffffff;
        }
        .toolbar fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            margin: 0;
            padding: 4px 8px 6px;
        }
        .toolbar legend {
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0284c7;
            padding: 0 4px;
        }
        .toolbar .checks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 8px;
        }
        .toolbar .checks label {
            font-size: 10.5px;
            color: #0f172a;
            font-weight: 500;
            cursor: pointer;
        }
        .toolbar .checks input[type="checkbox"] { margin: 0; }

        /* PRINT — letterhead logo */
        .letterhead .brand-with-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .letterhead .logo-img {
            max-height: 38px;
            max-width: 150px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .page.portrait .letterhead .logo-img { max-height: 48px; max-width: 180px; }

        /* A4 LANDSCAPE PAGE — 297×210mm */
        .page {
            width: var(--page-w);
            min-height: var(--page-h);
            margin: 0 auto 12px;
            background: #ffffff;
            padding: 8mm 10mm;
            box-shadow: 0 6px 20px rgba(15,23,42,.10);
            border-radius: 2px;
            page-break-after: always;
            position: relative;
            overflow: hidden;
        }
        .page:last-of-type { page-break-after: auto; }

        /* PORTRAIT PAGE — title + final */
        .page.portrait {
            width: 186mm;
            min-height: 273mm;
            padding: 12mm 14mm;
        }

        /* HEADER LETTERHEAD */
        .letterhead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .letterhead .brand {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }
        .letterhead .brand .sub {
            font-size: 9px;
            font-weight: 500;
            color: #64748b;
            display: block;
            margin-top: 1px;
            letter-spacing: 0;
        }
        .letterhead .meta {
            font-size: 9px;
            color: #475569;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.3;
        }

        h1.doc-title {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 3px 0;
            letter-spacing: -0.01em;
            line-height: 1.15;
        }
        .page.portrait h1.doc-title { font-size: 22px; margin-bottom: 4px; }
        p.doc-subtitle {
            font-size: 10px;
            color: #64748b;
            margin: 0 0 8px 0;
        }
        .page.portrait p.doc-subtitle { font-size: 12px; margin-bottom: 14px; }

        h2.section {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #0284c7;
            margin: 10px 0 5px 0;
            padding-bottom: 3px;
            border-bottom: 1px solid #e2e8f0;
        }
        .page.portrait h2.section { font-size: 12px; margin: 16px 0 8px 0; }
        h3.subsec {
            font-size: 10px;
            font-weight: 700;
            color: #1e293b;
            margin: 8px 0 3px 0;
        }

        /* KPI ROW */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin: 8px 0 10px;
        }
        .kpi {
            border: 1px solid #e2e8f0;
            border-left: 3px solid #0284c7;
            border-radius: 3px;
            padding: 6px 9px;
            background: #f8fafc;
        }
        .kpi .lbl { font-size: 8px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 700; }
        .kpi .val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #0f172a; margin-top: 1px; line-height: 1.1; }
        .kpi.diff-pos { border-left-color: #059669; }
        .kpi.diff-neg { border-left-color: #be123c; }
        .kpi.diff-pos .val { color: #047857; }
        .kpi.diff-neg .val { color: #be123c; }

        .page.portrait .kpi-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .page.portrait .kpi .lbl { font-size: 9px; }
        .page.portrait .kpi .val { font-size: 16px; }

        /* TABLES — ultra compact */
        table.t {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 6px;
            font-size: 9px;
            table-layout: auto;
        }
        table.t th {
            background: #1e293b;
            color: #f1f5f9;
            font-weight: 700;
            padding: 4px 5px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 8px;
            border: 1px solid #1e293b;
            white-space: nowrap;
        }
        table.t td {
            padding: 3px 5px;
            border: 1px solid #e2e8f0;
            vertical-align: middle;
            font-size: 9px;
        }
        table.t tr:nth-child(odd) td { background: #f8fafc; }
        table.t td.num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }
        table.t th.num { text-align: center; }
        table.t td.dash {
            text-align: center;
            color: #94a3b8;
        }
        table.t tfoot td {
            background: #e2e8f0 !important;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
            border-top: 2px solid #94a3b8;
            font-size: 9px;
        }
        table.t tfoot td:first-child { text-align: left; font-family: 'Inter', sans-serif; }

        /* WIDE TABLE — 13 categories — needs even tighter */
        table.t.wide {
            font-size: 8.5px;
        }
        table.t.wide th, table.t.wide td {
            padding: 2px 3px;
        }
        table.t.wide th { font-size: 7.5px; letter-spacing: 0; }
        table.t.wide .meta {
            font-size: 7.5px; line-height: 1.2;
        }
        table.t.wide .meta .insurer { font-weight: 600; color: #0f172a; }
        table.t.wide .meta .cno { color: #64748b; font-family: 'JetBrains Mono', monospace; }
        table.t.wide .meta .note { color: #854d0e; font-style: italic; font-size: 7px; }

        /* COMPARISON */
        .cmp {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 6px;
            font-size: 9px;
        }
        .cmp th, .cmp td {
            padding: 3px 6px;
            border-bottom: 1px solid #e2e8f0;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .cmp th { background: #1e293b; color: #f1f5f9; font-family: 'Inter', sans-serif; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
        .cmp th:first-child, .cmp td:first-child { text-align: left; font-family: 'Inter', sans-serif; }
        .cmp tr.total td { background: #e2e8f0; font-weight: 700; border-top: 2px solid #94a3b8; }
        .cmp .pos { color: #047857; font-weight: 700; }
        .cmp .neg { color: #be123c; font-weight: 700; }
        .cmp .zero { color: #94a3b8; }

        /* SCENARIO */
        .scen-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 6px 0;
        }
        .scen-box {
            border: 1px solid #e2e8f0;
            border-radius: 3px;
            padding: 7px 10px;
            background: #f8fafc;
        }
        .scen-box.curr { border-left: 3px solid #94a3b8; }
        .scen-box.proposed { border-left: 3px solid #0284c7; }
        .scen-box h4 {
            margin: 0 0 4px 0;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .scen-box.curr h4 { color: #475569; }
        .scen-box.proposed h4 { color: #0284c7; }
        .scen-box .row {
            display: flex;
            justify-content: space-between;
            padding: 1px 0;
            font-size: 9px;
        }
        .scen-box .row.total { font-weight: 700; border-top: 1px solid #cbd5e1; margin-top: 4px; padding-top: 4px; }

        /* RECOMMENDATION BLOCKS */
        .reco {
            border-left: 3px solid;
            padding: 6px 10px;
            margin: 3px 0;
            border-radius: 3px;
            background: #f8fafc;
            font-size: 9.5px;
            line-height: 1.45;
        }
        .reco.info { border-left-color: #0284c7; }
        .reco.warn { border-left-color: #d97706; background: #fffbeb; }
        .reco.danger { border-left-color: #be123c; background: #fef2f2; }
        .reco.success { border-left-color: #047857; background: #f0fdf4; }
        .reco strong { color: #0f172a; }

        /* SIGNATURE BLOCK */
        .sig {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }
        .sig div {
            border-top: 1px solid #94a3b8;
            padding-top: 4px;
            text-align: center;
            font-size: 9px;
            color: #475569;
        }

        footer.page-footer {
            margin-top: 8px;
            padding-top: 4px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge-i {
            display: inline-block;
            font-size: 7.5px;
            font-family: 'JetBrains Mono', monospace;
            padding: 0 4px;
            border-radius: 2px;
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            margin-left: 3px;
        }

        .brief {
            background: #fef9c3;
            border: 1px solid #facc15;
            border-radius: 3px;
            padding: 6px 10px;
            font-size: 9.5px;
            line-height: 1.5;
            color: #422006;
            margin: 6px 0 10px;
            font-style: italic;
        }
        .brief::before {
            content: '✎ Zadání poradce: ';
            font-weight: 700;
            font-style: normal;
            color: #854d0e;
        }
        .page.portrait .brief { font-size: 11px; padding: 10px 14px; margin: 12px 0 18px; }

        /* ═══════════════════════════════════════════════════════════════════
           PRINT — mixed orientations workaround.
           Prohlížeče (Chrome zejména) neumí spolehlivě střídat portrait/landscape
           v jednom tiskovém souboru. Proto FORCE-tiskneme všechny stránky jako
           A4 portrait a obsah landscape stránek otočíme o 90° pomocí CSS transform.
           Uživatel po vytištění jednoduše otočí příslušný list papíru o 90°
           proti směru hodinových ručiček a čte landscape obsah ve správné orientaci.
           ═══════════════════════════════════════════════════════════════════ */

        /* SCREEN VIEW — .landscape-inner se chová jako transparentní wrapper. */
        .landscape-inner {
            display: block;
        }

        @media print {
            html, body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .toolbar { display: none !important; }

            /* Všechny stránky na A4 portrait papír, bez printerových margin
               (margins jsou součástí .page padding). */
            @page { size: A4 portrait; margin: 0; }

            /* Každý .page = jeden A4 portrait list papíru. */
            .page {
                width: 210mm !important;
                height: 297mm !important;
                min-height: 0 !important;
                max-width: 210mm !important;
                max-height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                position: relative;
                overflow: hidden !important;
                page-break-after: always;
                page-break-inside: avoid;
                /* `contain: paint` zajistí, že potomci (i absolutně pozicovaní)
                   se vykreslí jen uvnitř hranic .page — kritické pro print. */
                contain: paint;
            }
            .page:last-of-type { page-break-after: auto; }

            /* Portrait stránky (.page.portrait): obsah se renderuje normálně */
            .page.portrait {
                padding: 12mm 14mm !important;
            }
            .page.portrait .landscape-inner {
                position: static;
                transform: none;
                width: 100%;
                height: 100%;
                padding: 0;
            }

            /* Landscape stránky: vnitřní wrapper má PŘESNĚ stejné rozměry jako
               .page na screen view (273×186 mm s padding 8mm 10mm) — aby tabulky
               a sazba layoutovaly identicky. Použijeme position: absolute s
               TOP-LEFT origin + explicitní translate hodnoty (deterministicky
               spolehlivější v Chromu při tisku než translate(-50%, -50%)).

               Matematika rotace o 90° kolem (0,0):
               - Před rotací: x ∈ [0, 273], y ∈ [0, 186]
               - Po rotate(90deg): x ∈ [-186, 0], y ∈ [0, 273]
               - Po translate(198mm, 12mm): x ∈ [12, 198], y ∈ [12, 285]
               → 12mm okraj všude kolem na 210×297 papíru. */
            .page:not(.portrait) .landscape-inner {
                position: absolute;
                top: 0;
                left: 0;
                width: 273mm;
                height: 186mm;
                padding: 8mm 10mm;
                box-sizing: border-box;
                background: white;
                transform: translate(198mm, 12mm) rotate(90deg);
                transform-origin: top left;
                page-break-inside: avoid;
            }

            /* Tabulky uvnitř rotovaného landscape-inner nesmí page-breakovat —
               celá rotovaná stránka je jeden A4 list. Mimo landscape-inner (na
               portrait stránkách) povolíme splitting velkých tabulek. */
            .landscape-inner table { page-break-inside: avoid; break-inside: avoid; }
            .landscape-inner tr { page-break-inside: avoid; break-inside: avoid; }
            .page.portrait table { page-break-inside: auto; }
            .page.portrait tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
    </style>
</head>
<body>

    <!-- TOOLBAR (skryto v tisku) -->
    <div class="toolbar no-print">
        <fieldset>
            <legend>Co tisknout</legend>
            <div class="checks">
                <label><input type="checkbox" id="chkCover" checked onchange="render()"> Titulní strana</label>
                <label><input type="checkbox" id="chkBrief" onchange="render()"> Zadání poradce</label>
                <label><input type="checkbox" id="chkCurrent" checked onchange="render()"> Stáv. portfolio</label>
                <label><input type="checkbox" id="chkProposed" checked onchange="render()"> Návrh portfolia</label>
                <label><input type="checkbox" id="chkCompare" checked onchange="render()"> Srovnání + scénář</label>
                <label><input type="checkbox" id="chkReco" checked onchange="render()"> Doporučení</label>
            </div>
        </fieldset>
        <div class="toolbar-row" style="justify-content:space-between;flex:1 1 100%">
            <div style="font-size:10px;color:#64748b;line-height:1.4;max-width:520px">
                💡 <strong>Tip:</strong> Tiskněte v orientaci <strong>A4 na výšku</strong> (portrait).
                Stránky portfolia a srovnání jsou automaticky otočeny o 90° — po vytištění
                jen otočte daný list <strong>proti směru hodinových ručiček</strong>.
            </div>
            <div style="display:flex;gap:5px">
                <button onclick="window.close()" title="Zavřít okno">✕ Zavřít</button>
                <button onclick="window.print()" class="primary" title="Tisk / Uložit jako PDF">⎙ Tisk / PDF</button>
            </div>
        </div>
    </div>

    <div id="printRoot"></div>

    <script>
    /* ════════════════════════════════════════════════════════════════════
       tisk.html — A4 LANDSCAPE pro široké tabulky, PORTRAIT pro titulní stranu
       a finální stranu s doporučeními.
       ════════════════════════════════════════════════════════════════════ */
    const D = window.INSURANCE_DATA;
    const STORAGE_KEY = 'insurance_compare_data';
    const DEFAULT_LOGO_URL = 'https://martin-cht.github.io/pojisteni/soubory/logo.png';

    /* Cookie helper – ekvivalent insurance-app.js getCookie/setCookie */
    function getCookie(name) {
        try {
            const m = document.cookie.split('; ').find(r => r.startsWith(name + '='));
            return m ? decodeURIComponent(m.split('=')[1]) : '';
        } catch (e) { return ''; }
    }

    let state = { clients: [], currentContracts: [], proposedContracts: [], loans: [], scenario: {}, adviserBrief: '', advisorName: '', logoUrl: '' };
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}
    /* Fallback z cookies, pokud localStorage byl smazán nebo neobsahuje branding. */
    if (!state.advisorName) state.advisorName = getCookie('insurance_advisor_name') || '';
    if (!state.logoUrl) state.logoUrl = getCookie('insurance_logo_url') || DEFAULT_LOGO_URL;

    function advisorName() {
        return (state.advisorName || '').trim() || 'investiční poradce';
    }
    function logoHtml() {
        const url = (state.logoUrl || '').trim();
        if (!url) return '';
        return `<img src="${esc(url)}" alt="Logo" class="logo-img" onerror="this.style.display='none'">`;
    }

    function num(v) { v = parseFloat(v); return isNaN(v) ? 0 : v; }
    function fmtCZK(n) { return num(n).toLocaleString('cs-CZ', { maximumFractionDigits: 0 }) + ' Kč'; }
    function fmtCZKShort(n) {
        n = num(n);
        if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
        if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0) + 'k';
        return n.toFixed(0);
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function clientName(id) { const c = state.clients.find(c => c.id === id); return c ? c.name : '(bez klienta)'; }

    function premMonthly(c) {
        const f = c.conditions && c.conditions.paymentFrequency;
        const p = num(c.premium);
        if (f === 'yearly') return p / 12;
        if (f === 'quarterly') return p / 3;
        if (f === 'singlepay') return 0;
        return p;
    }
    function sumPrem(list) { return (list || []).reduce((s, c) => s + premMonthly(c), 0); }
    function sumItem(list, key) { return (list || []).reduce((s, c) => s + num(c.items && c.items[key]), 0); }
    function sumItemFor(list, cid, key) { return (list || []).filter(c => c.clientId === cid).reduce((s, c) => s + num(c.items && c.items[key]), 0); }
    function sumLoans() { return (state.loans || []).reduce((s, l) => s + num(l.amount), 0); }

    function computeScenarioForList(list, person, sc) {
        const personId = person.id;
        const items = list.filter(c => c.clientId === personId);
        const sums = {};
        D.CATEGORIES.forEach(cat => { sums[cat.key] = items.reduce((s, c) => s + num(c.items && c.items[cat.key]), 0); });
        const pnDays = sc.pnDays || 90;
        const hospDays = sc.hospDays || 5;
        let urazPay = 0, urazVelkyPay = 0;
        if (sc.injury === 'minor' || sc.injury === 'both' || !sc.injury) urazPay = sums.uraz * pnDays;
        if (sc.injury === 'major' || sc.injury === 'both') urazVelkyPay = sums.urazVelky * Math.max(0, pnDays - 30);
        const hospPay = sums.hosp * hospDays;
        const hospUrazPay = sums.hospUraz * hospDays;
        let pn28Pay, pn61Pay;
        if (sc.retroactive) {
            pn28Pay = pnDays >= 29 ? sums.pn28 * pnDays : 0;
            pn61Pay = pnDays >= 61 ? sums.pn61 * pnDays : 0;
        } else {
            pn28Pay = sums.pn28 * Math.max(0, pnDays - 28);
            pn61Pay = sums.pn61 * Math.max(0, pnDays - 60);
        }
        const chirPay = sums.chir;
        const lines = [
            { label: 'Drobný úraz',  amount: urazPay,      include: sums.uraz > 0 && (sc.injury !== 'major') },
            { label: 'Vážný úraz',   amount: urazVelkyPay, include: sums.urazVelky > 0 && (sc.injury === 'major' || sc.injury === 'both') },
            { label: 'Hospitalizace',amount: hospPay,      include: sums.hosp > 0 },
            { label: 'Hosp. úraz',   amount: hospUrazPay,  include: sums.hospUraz > 0 },
            { label: 'PN 28. den',   amount: pn28Pay,      include: sums.pn28 > 0 },
            { label: 'PN 61. den',   amount: pn61Pay,      include: sums.pn61 > 0 },
            { label: 'Chir. zákrok', amount: chirPay,      include: sums.chir > 0 }
        ];
        const total = lines.filter(l => l.include).reduce((s, l) => s + l.amount, 0);
        return { lines, total };
    }

    /* ─────────────────────────────────────────────────────────────────
       RENDER
       ───────────────────────────────────────────────────────────────── */
    function render() {
        const root = document.getElementById('printRoot');
        root.innerHTML = '';
        const chk = id => { const e = document.getElementById(id); return e ? e.checked : true; };
        const showBrief = chk('chkBrief');
        const today = new Date().toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
        const curM = sumPrem(state.currentContracts);
        const newM = sumPrem(state.proposedContracts);
        const diffM = newM - curM;

        /* STRÁNKA 1 — TITULNÍ + PŘEHLED (PORTRAIT) */
        if (chk('chkCover')) {
            root.appendChild(buildPage1(today, curM, newM, diffM, showBrief));
        }
        /* STRÁNKA 2 — STÁVAJÍCÍ (LANDSCAPE) */
        if (chk('chkCurrent')) {
            root.appendChild(buildPortfolioPage(state.currentContracts, 'Stávající portfolio pojištění', 'Detailní přehled aktuálně sjednaných smluv pojistníka a rodiny.', today));
        }
        /* STRÁNKA 3 — NÁVRH (LANDSCAPE) */
        if (chk('chkProposed')) {
            root.appendChild(buildPortfolioPage(state.proposedContracts, 'Navrhované portfolio pojištění', 'Doporučená úprava — nové smlouvy, úpravy nebo zachované smlouvy.', today));
        }
        /* STRÁNKA 4 — SROVNÁNÍ + SCÉNÁŘ (LANDSCAPE) */
        if (chk('chkCompare')) {
            root.appendChild(buildComparePage(today, curM, newM, diffM));
        }
        /* STRÁNKA 5 — DOPORUČENÍ (PORTRAIT) */
        if (chk('chkReco')) {
            root.appendChild(buildRecoPage(today, curM, newM, diffM));
        }
    }

    function buildPage1(today, curM, newM, diffM, showBrief) {
        const p = document.createElement('div');
        p.className = 'page portrait';
        const logo = logoHtml();
        p.innerHTML = `
            <div class="letterhead">
                <div class="brand-with-logo">
                    ${logo}
                    <div class="brand">
                        Srovnání pojištění
                        <span class="sub">Analýza a doporučení k pojistnému portfoliu</span>
                    </div>
                </div>
                <div class="meta">
                    Datum: <strong>${today}</strong><br>
                    Připravil: ${esc(advisorName())}
                </div>
            </div>

            <h1 class="doc-title">Nezávazné srovnání stávajícího a navrhovaného pojištění</h1>
            <p class="doc-subtitle">Pro: ${esc(state.clients.length ? state.clients.map(c => c.name).join(', ') : 'klient')}</p>

            ${showBrief && state.adviserBrief ? `<div class="brief">${esc(state.adviserBrief)}</div>` : ''}

            <h2 class="section">1. Souhrn portfolia</h2>
            <div class="kpi-row">
                <div class="kpi"><div class="lbl">Stáv. měsíčně</div><div class="val">${fmtCZK(curM)}</div></div>
                <div class="kpi"><div class="lbl">Návrh měsíčně</div><div class="val">${fmtCZK(newM)}</div></div>
                <div class="kpi ${diffM > 0 ? 'diff-neg' : diffM < 0 ? 'diff-pos' : ''}"><div class="lbl">Změna měs.</div><div class="val">${diffM >= 0 ? '+' : ''}${fmtCZK(diffM)}</div></div>
                <div class="kpi"><div class="lbl">Stáv. ročně</div><div class="val">${fmtCZK(curM * 12)}</div></div>
                <div class="kpi"><div class="lbl">Návrh ročně</div><div class="val">${fmtCZK(newM * 12)}</div></div>
                <div class="kpi ${diffM > 0 ? 'diff-neg' : diffM < 0 ? 'diff-pos' : ''}"><div class="lbl">Změna roč.</div><div class="val">${diffM >= 0 ? '+' : ''}${fmtCZK(diffM * 12)}</div></div>
            </div>

            <h2 class="section">2. Závazky a doporučené krytí smrti</h2>
            <table class="t">
                <thead>
                    <tr><th>Závazek</th><th>Dlužník</th><th class="num">Výše (Kč)</th></tr>
                </thead>
                <tbody>
                    ${(state.loans || []).map(l => `<tr>
                        <td>${esc(l.name)}</td>
                        <td>${esc(clientName(l.linkedClientId))}</td>
                        <td class="num">${fmtCZK(l.amount)}</td>
                    </tr>`).join('') || '<tr><td colspan="3" style="text-align:center;color:#94a3b8;font-style:italic">— žádné závazky —</td></tr>'}
                </tbody>
                ${(state.loans || []).length ? `<tfoot>
                    <tr><td colspan="2">Závazky celkem</td><td class="num">${fmtCZK(sumLoans())}</td></tr>
                    <tr><td colspan="2">Doporučené krytí (závazky + 15 %)</td><td class="num">${fmtCZK(Math.round(sumLoans() * 1.15))}</td></tr>
                </tfoot>` : ''}
            </table>

            <h2 class="section">3. Pojištěné osoby</h2>
            <table class="t">
                <thead>
                    <tr>
                        <th>Jméno</th>
                        <th>Rok</th>
                        <th class="num">Příjem/měs</th>
                        <th>Typ</th>
                        <th class="num">Stáv.</th>
                        <th class="num">Návrh</th>
                    </tr>
                </thead>
                <tbody>
                    ${(state.clients || []).map(c => `<tr>
                        <td><strong>${esc(c.name)}</strong></td>
                        <td>${c.birthYear || '—'}</td>
                        <td class="num">${fmtCZK(c.incomeGross || 0)}</td>
                        <td>${c.isEntrepreneur ? 'OSVČ' : 'Zaměst.'}</td>
                        <td class="num">${state.currentContracts.filter(s => s.clientId === c.id).length}</td>
                        <td class="num">${state.proposedContracts.filter(s => s.clientId === c.id).length}</td>
                    </tr>`).join('')}
                </tbody>
            </table>

            <footer class="page-footer"><span>Insurance Terminal</span><span>Strana 1</span></footer>
        `;
        return p;
    }

    function buildPortfolioPage(list, title, subtitle, today) {
        const p = document.createElement('div');
        p.className = 'page';
        const blocks = state.clients.map(person => {
            const items = list.filter(c => c.clientId === person.id);
            if (!items.length) return '';
            const personPrem = items.reduce((s, c) => s + premMonthly(c), 0);

            const rows = items.map(c => `
                <tr>
                    <td class="meta">
                        <div class="insurer">${esc(c.insurer || '—')}</div>
                        <div class="cno">${esc(c.contractNo || '—')}${c.start || c.end ? ` · ${c.start || '?'}–${c.end || '?'}` : ''}</div>
                        ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
                    </td>
                    ${D.CATEGORIES.map(cat => {
                        const v = num(c.items && c.items[cat.key]);
                        if (!v) return `<td class="dash">·</td>`;
                        return `<td class="num">${cat.kind === 'daily' ? v + '/d' : fmtCZKShort(v)}</td>`;
                    }).join('')}
                    <td class="num">${fmtCZK(c.premium || 0)}</td>
                </tr>
            `).join('');
            const totals = D.CATEGORIES.map(cat => {
                const v = sumItemFor(list, person.id, cat.key);
                if (!v) return `<td class="dash">·</td>`;
                return `<td class="num">${cat.kind === 'daily' ? v + '/d' : fmtCZKShort(v)}</td>`;
            }).join('');

            return `
                <h3 class="subsec">${esc(person.name)} — ${items.length} sml. · Σ ${fmtCZK(personPrem)} / měs</h3>
                <table class="t wide">
                    <thead>
                        <tr>
                            <th style="width:25%">Smlouva</th>
                            ${D.CATEGORIES.map(c => `<th class="num" title="${esc(c.label)}">${esc(c.mini)}</th>`).join('')}
                            <th class="num">Pl./měs</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr>
                            <td>Σ ${esc(person.name)}</td>
                            ${totals}
                            <td class="num">${fmtCZK(personPrem)}</td>
                        </tr>
                    </tfoot>
                </table>
            `;
        }).filter(Boolean).join('');

        p.innerHTML = `
            <div class="landscape-inner">
                <div class="letterhead">
                    <div class="brand-with-logo">
                        ${logoHtml()}
                        <div class="brand">Srovnání pojištění <span class="sub">${esc(title)}</span></div>
                    </div>
                    <div class="meta">${today}</div>
                </div>
                <h1 class="doc-title">${esc(title)}</h1>
                <p class="doc-subtitle">${esc(subtitle)}</p>

                <div style="font-size:8.5px;color:#64748b;margin-bottom:4px">
                    <strong>Legenda zkratek:</strong>
                    ${D.CATEGORIES.map(c => `<span style="margin-right:6px"><strong>${esc(c.mini)}</strong>=${esc(c.label)}</span>`).join('')}
                </div>

                ${blocks || '<p style="font-style:italic;color:#94a3b8">Žádné smlouvy přiřazené k osobám.</p>'}

                <footer class="page-footer"><span>Insurance Terminal</span><span>${esc(title)}</span></footer>
            </div>
        `;
        return p;
    }

    function buildComparePage(today, curM, newM, diffM) {
        const p = document.createElement('div');
        p.className = 'page';
        const rows = D.CATEGORIES.map(cat => {
            const cv = sumItem(state.currentContracts, cat.key);
            const nv = sumItem(state.proposedContracts, cat.key);
            const diff = nv - cv;
            const cls = diff > 0 ? 'pos' : diff < 0 ? 'neg' : 'zero';
            const fmt = (v) => v ? (cat.kind === 'daily' ? v + ' Kč/d' : fmtCZK(v)) : '—';
            return `<tr>
                <td>${esc(cat.label)}</td>
                <td>${fmt(cv)}</td>
                <td>${fmt(nv)}</td>
                <td class="${cls}">${diff === 0 ? '±0' : (diff > 0 ? '+' : '') + fmt(diff)}</td>
            </tr>`;
        }).join('');

        const sc = state.scenario || { pnDays: 90, hospDays: 5, injury: 'minor', retroactive: false };
        const person = state.clients.find(c => c.id === sc.person) || state.clients[0];
        let scenHtml = '<p style="font-style:italic;color:#94a3b8">Není koho simulovat.</p>';
        if (person) {
            const cur = computeScenarioForList(state.currentContracts, person, sc);
            const nw  = computeScenarioForList(state.proposedContracts, person, sc);
            const diff = nw.total - cur.total;
            scenHtml = `
                <p style="font-size:9.5px;color:#475569;margin-bottom:4px">
                    Scénář pro <strong>${esc(person.name)}</strong>: ${sc.pnDays} dní PN, ${sc.hospDays} dní hosp., úraz <strong>${({minor:'drobný',major:'vážný',both:'drobný+vážný'})[sc.injury] || 'drobný'}</strong>${sc.retroactive ? ', PN <strong>zpětně</strong>' : ''}.
                </p>
                <div class="scen-grid">
                    <div class="scen-box curr">
                        <h4>Stávající plnění</h4>
                        ${cur.lines.filter(l => l.include).map(l => `<div class="row"><span>${esc(l.label)}</span><span>${fmtCZK(l.amount)}</span></div>`).join('') || '<div class="row" style="color:#94a3b8;font-style:italic"><span>— žádné plnění —</span><span></span></div>'}
                        <div class="row total"><span>Celkem</span><span>${fmtCZK(cur.total)}</span></div>
                    </div>
                    <div class="scen-box proposed">
                        <h4>Navrhované plnění</h4>
                        ${nw.lines.filter(l => l.include).map(l => `<div class="row"><span>${esc(l.label)}</span><span>${fmtCZK(l.amount)}</span></div>`).join('') || '<div class="row" style="color:#94a3b8;font-style:italic"><span>— žádné plnění —</span><span></span></div>'}
                        <div class="row total"><span>Celkem</span><span>${fmtCZK(nw.total)}</span></div>
                    </div>
                </div>
                <p style="text-align:right;font-size:10px;margin-top:4px">
                    <strong>Rozdíl ve prospěch ${diff >= 0 ? 'návrhu' : 'stávajícího'}: ${(diff >= 0 ? '+' : '')}${fmtCZK(diff)}</strong>
                </p>
            `;
        }

        p.innerHTML = `
            <div class="landscape-inner">
                <div class="letterhead">
                    <div class="brand-with-logo">
                        ${logoHtml()}
                        <div class="brand">Srovnání pojištění <span class="sub">Položkové srovnání</span></div>
                    </div>
                    <div class="meta">${today}</div>
                </div>
                <h1 class="doc-title">Položkové srovnání — Stávající × Návrh</h1>
                <p class="doc-subtitle">Souhrn pojistných částek a denních dávek napříč všemi smlouvami a osobami.</p>

                <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:14px">
                    <div>
                        <h2 class="section" style="margin-top:0">Pojistné krytí — kategorie</h2>
                        <table class="cmp">
                            <thead><tr><th>Kategorie</th><th>Stávající</th><th>Návrh</th><th>Rozdíl</th></tr></thead>
                            <tbody>${rows}</tbody>
                            <tfoot>
                                <tr class="total"><td>Měsíční pojistné</td><td>${fmtCZK(curM)}</td><td>${fmtCZK(newM)}</td><td class="${diffM > 0 ? 'neg' : diffM < 0 ? 'pos' : 'zero'}">${diffM === 0 ? '±0' : (diffM > 0 ? '+' : '') + fmtCZK(diffM)}</td></tr>
                                <tr class="total"><td>Roční pojistné</td><td>${fmtCZK(curM*12)}</td><td>${fmtCZK(newM*12)}</td><td class="${diffM > 0 ? 'neg' : diffM < 0 ? 'pos' : 'zero'}">${diffM === 0 ? '±0' : (diffM*12 > 0 ? '+' : '') + fmtCZK(diffM*12)}</td></tr>
                            </tfoot>
                        </table>
                    </div>
                    <div>
                        <h2 class="section" style="margin-top:0">Modelový scénář plnění</h2>
                        ${scenHtml}
                    </div>
                </div>

                <footer class="page-footer"><span>Insurance Terminal</span><span>Srovnání</span></footer>
            </div>
        `;
        return p;
    }

    function buildRecoPage(today, curM, newM, diffM) {
        const p = document.createElement('div');
        p.className = 'page portrait';
        const recos = computeRecommendations(curM, newM, diffM);

        p.innerHTML = `
            <div class="letterhead">
                <div class="brand-with-logo">
                    ${logoHtml()}
                    <div class="brand">Srovnání pojištění <span class="sub">Závěry a doporučení</span></div>
                </div>
                <div class="meta">${today}</div>
            </div>
            <h1 class="doc-title">Doporučení poradce a souhrn</h1>
            <p class="doc-subtitle">Klíčové body, na kterých by měl klient stavět rozhodnutí.</p>

            <h2 class="section">Klíčová zjištění</h2>
            ${recos.map(r => `<div class="reco ${r.type}">${r.text}</div>`).join('')}

            <h2 class="section">Závěr</h2>
            <p style="font-size:10.5px;line-height:1.6;color:#334155">
                ${recos.some(r => r.type !== 'success')
                    ? 'Tento dokument představuje nezávazné posouzení Vašeho pojistného portfolia. Konečné rozhodnutí o úpravě smluv leží na Vás po prostudování platných obchodních podmínek příslušné pojišťovny a po případné konzultaci s nezávislým makléřem či právníkem.'
                    : 'Vaše portfolio bylo posouzeno jako vyrovnané. Doporučujeme periodickou revizi alespoň 1× ročně, zejména při změně příjmů, zaměstnání či rodinné situace.'}
            </p>
            <p style="font-size:9px;color:#64748b;line-height:1.55;margin-top:10px">
                <strong>Právní upozornění:</strong> Tato sestava má informativní charakter a nenahrazuje pojistnou smlouvu, IPID, ani Záznam z jednání podle § 79 zákona č. 170/2018 Sb.
                Konkrétní pojistné částky a podmínky se mohou lišit dle aktuálních sazebníků pojišťoven. Pro závazný návrh kontaktujte svého poradce.
            </p>
            <div class="sig">
                <div>klient</div>
                <div>${esc(advisorName())}</div>
            </div>
            <footer class="page-footer"><span>Insurance Terminal · v2026</span><span>Závěr</span></footer>
        `;
        return p;
    }

    function computeRecommendations(curM, newM, diffM) {
        const recos = [];
        const loans = sumLoans();
        const smrtCur = sumItem(state.currentContracts, 'smrt');
        const smrtNw  = sumItem(state.proposedContracts, 'smrt');
        if (loans > 0) {
            if (smrtCur < loans) recos.push({ type: 'danger',
                text: `<strong>Podpojištění (stávající):</strong> krytí smrti ${fmtCZK(smrtCur)} je <strong>${fmtCZK(loans - smrtCur)} pod závazky</strong> (${fmtCZK(loans)}). Pozůstalí by museli závazky řešit z jiných zdrojů.` });
            if (smrtNw >= loans) recos.push({ type: 'success',
                text: `<strong>Návrh řeší krytí smrti:</strong> ${fmtCZK(smrtNw)} ≥ závazky ${fmtCZK(loans)}.` });
            else if (smrtNw < loans) recos.push({ type: 'warn',
                text: `<strong>Návrh stále nepokrývá:</strong> chybí ${fmtCZK(loans - smrtNw)} k pokrytí závazků.` });
        }
        const invNw  = sumItem(state.proposedContracts, 'invalidita');
        if (loans > 0 && invNw < loans * 0.5) {
            recos.push({ type: 'warn',
                text: `<strong>Slabé krytí invalidity:</strong> ${fmtCZK(invNw)} je málo vzhledem k závazkům ${fmtCZK(loans)}. Doporučení: 50–80 % výše úvěrů (min. ${fmtCZK(Math.round(loans * 0.5))}).` });
        }
        const pnAny = sumItem(state.proposedContracts, 'pn28') + sumItem(state.proposedContracts, 'pn61');
        if (pnAny === 0 && state.clients.some(c => num(c.incomeGross) > 0)) {
            recos.push({ type: 'info',
                text: `<strong>Návrh neobsahuje pojištění pracovní neschopnosti.</strong> Při příjmu z práce je vhodné mít, zvláště pro OSVČ.` });
        }
        if (Math.abs(diffM) > 100) {
            const pct = curM > 0 ? (diffM / curM * 100) : 100;
            recos.push({ type: diffM > 0 ? 'warn' : 'success',
                text: `<strong>Měsíční pojistné se ${diffM > 0 ? 'zvyšuje' : 'snižuje'}:</strong> ${diffM > 0 ? '+' : ''}${fmtCZK(diffM)} (${diffM > 0 ? '+' : ''}${pct.toFixed(0)} %).` });
        }
        D.CATEGORIES.forEach(cat => {
            const c = sumItem(state.currentContracts, cat.key);
            const n = sumItem(state.proposedContracts, cat.key);
            if (c > 0 && n === 0) {
                recos.push({ type: 'warn',
                    text: `<strong>Vypadlá kategorie „${esc(cat.label)}"</strong> — ve stávajícím portfoliu byla ${cat.kind === 'daily' ? c + ' Kč/d' : fmtCZK(c)}, v návrhu chybí. Ověřte, zda je to záměr.` });
            }
        });
        if (!recos.length) recos.push({ type: 'success', text: 'Portfolio vypadá vyrovnaně bez zásadních mezer.' });
        return recos;
    }

    /* Init */
    render();
    </script>
