<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srovnání a modelace životního pojištění – Klientská sestava</title>
    <script src="insurance-data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            /* A4 landscape inner area at 12mm margin = 273×186mm */
            --page-w: 273mm;
            --page-h: 186mm;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #cbd5e1;
            color: #0f172a;
            margin: 0;
            padding: 16px;
            font-size: 10px;
            line-height: 1.42;
        }

        /* ── TOOLBAR (skryto při tisku) ── */
        .toolbar {
            max-width: 1120px;
            margin: 8px auto 16px;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 4px 12px rgba(15,23,42,.12);
        }
        .toolbar fieldset {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin: 0;
            padding: 6px 10px 8px;
            flex: 1 1 auto;
        }
        .toolbar legend {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0284c7;
            padding: 0 4px;
        }
        .toolbar .checks {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .toolbar .checks label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #0f172a;
            font-weight: 500;
            cursor: pointer;
        }
        .toolbar select {
            font-size: 11px;
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: #f8fafc;
            color: #0f172a;
            font-weight: 600;
        }
        .toolbar button {
            font-size: 11.5px;
            font-weight: 700;
            padding: 8px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            color: #0f172a;
            cursor: pointer;
        }
        .toolbar button:hover { background: #f1f5f9; }
        .toolbar button.primary { background: #0284c7; color: white; border-color: #0284c7; }
        .toolbar button.primary:hover { background: #0369a1; }

        /* ── PAGES ── */
        .page {
            width: var(--page-w);
            min-height: var(--page-h);
            margin: 0 auto 14px;
            background: #ffffff;
            padding: 8mm 10mm;
            box-shadow: 0 6px 20px rgba(15,23,42,.14);
            border-radius: 2px;
            page-break-after: always;
            position: relative;
            overflow: hidden;
        }
        .page:last-of-type { page-break-after: auto; }

        .page.portrait {
            width: 186mm;
            min-height: 273mm;
            padding: 10mm 12mm;
        }

        /* ── LETTERHEAD (Hlavička s jasnou identifikací poradce a modelace) ── */
        .letterhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2.5px solid #0284c7;
            padding-bottom: 6px;
            margin-bottom: 8px;
            gap: 12px;
        }
        .letterhead .brand-with-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .letterhead .logo-img {
            max-height: 36px;
            max-width: 145px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .page.portrait .letterhead .logo-img { max-height: 44px; max-width: 170px; }
        .letterhead .brand {
            font-size: 13.5px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.01em;
            line-height: 1.15;
        }
        .letterhead .brand .sub {
            font-size: 9px;
            font-weight: 600;
            color: #0284c7;
            display: block;
            margin-top: 1px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .letterhead .meta {
            font-size: 8.5px;
            color: #334155;
            text-align: right;
            line-height: 1.35;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 4px 8px;
        }
        .letterhead .meta .model-id {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #0284c7;
            font-size: 9px;
        }

        h1.doc-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 2px 0;
            letter-spacing: -0.01em;
            line-height: 1.15;
        }
        .page.portrait h1.doc-title { font-size: 18px; margin-bottom: 3px; }
        p.doc-subtitle {
            font-size: 9.5px;
            color: #475569;
            margin: 0 0 7px 0;
        }

        h2.section {
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0369a1;
            margin: 8px 0 4px 0;
            padding-bottom: 2px;
            border-bottom: 1.5px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page.portrait h2.section { font-size: 10.5px; margin: 10px 0 5px 0; }
        h3.subsec {
            font-size: 9.5px;
            font-weight: 700;
            color: #0f172a;
            margin: 6px 0 3px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 3px 7px;
            border-left: 3px solid #0284c7;
            border-radius: 2px;
        }

        /* ── ADVISOR RECOMMENDATION HERO BOX ── */
        .advisor-hero {
            background: #f0f9ff;
            border: 1.5px solid #7dd3fc;
            border-left: 5px solid #0284c7;
            border-radius: 4px;
            padding: 7px 10px;
            margin: 6px 0 8px;
        }
        .advisor-hero .hero-title {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #0369a1;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        .advisor-hero .hero-body {
            font-size: 9.5px;
            line-height: 1.45;
            color: #0f172a;
            font-weight: 500;
        }

        .brief {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-left: 4px solid #d97706;
            border-radius: 4px;
            padding: 5px 9px;
            font-size: 9px;
            line-height: 1.4;
            color: #451a03;
            margin: 5px 0 7px;
        }
        .brief strong.lbl {
            text-transform: uppercase;
            font-size: 8.5px;
            color: #b45309;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 1px;
        }

        /* ── KPI ROW ── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin: 5px 0 8px;
        }
        .kpi {
            border: 1px solid #cbd5e1;
            border-top: 3px solid #0284c7;
            border-radius: 4px;
            padding: 5px 7px;
            background: #f8fafc;
        }
        .kpi .lbl { font-size: 7.5px; text-transform: uppercase; letter-spacing: 0.04em; color: #475569; font-weight: 700; }
        .kpi .val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; color: #0f172a; margin-top: 1px; line-height: 1.15; }
        .kpi .sub { font-size: 7.5px; color: #64748b; margin-top: 1px; }
        .kpi.curr { border-top-color: #059669; }
        .kpi.prop { border-top-color: #0284c7; background: #f0f9ff; }
        .kpi.score { border-top-color: #7c3aed; }
        .kpi.diff-pos { border-top-color: #059669; }
        .kpi.diff-neg { border-top-color: #d97706; }

        .page.portrait .kpi-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .page.portrait .kpi .val { font-size: 13.5px; }

        /* ── STATUS BADGES (pro jednoznačnou identifikaci smluv) ── */
        .st-badge {
            display: inline-block;
            font-size: 7.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 1.5px 5px;
            border-radius: 3px;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .status-keep        { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-modify      { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .status-cancel      { background: #ffe4e6; color: #9f1239; border-color: #fda4af; }
        .status-consolidate { background: #f3e8ff; color: #6b21a8; border-color: #d8b4fe; }
        .status-new         { background: #e0f2fe; color: #075985; border-color: #7dd3fc; }

        /* ── TABLES ── */
        table.t {
            width: 100%;
            border-collapse: collapse;
            margin: 3px 0 6px;
            font-size: 8.5px;
            table-layout: auto;
        }
        table.t th {
            background: #1e293b;
            color: #f8fafc;
            font-weight: 700;
            padding: 3.5px 5px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 7.5px;
            border: 1px solid #1e293b;
            white-space: nowrap;
        }
        table.t td {
            padding: 3px 5px;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
            font-size: 8.5px;
        }
        table.t tr:nth-child(even) td { background: #f8fafc; }
        table.t td.num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }
        table.t th.num { text-align: right; }
        table.t td.dash { text-align: center; color: #94a3b8; }
        table.t tfoot td {
            background: #e2e8f0 !important;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
            border-top: 1.5px solid #475569;
            font-size: 8.5px;
        }
        table.t tfoot td:first-child { text-align: left; font-family: 'Inter', sans-serif; }

        table.t.wide th, table.t.wide td { padding: 2.5px 3.5px; font-size: 8px; }
        table.t.wide th { font-size: 7.2px; text-align: center; }
        table.t.wide th:first-child, table.t.wide th:nth-child(2) { text-align: left; }
        table.t.wide .meta .insurer { font-weight: 700; color: #0f172a; font-size: 8.5px; }
        table.t.wide .meta .cno { color: #475569; font-family: 'JetBrains Mono', monospace; font-size: 7.5px; }
        table.t.wide .meta .note { color: #92400e; font-style: italic; font-size: 7.2px; margin-top: 1px; }

        /* ── COMPARISON TABLE ── */
        .cmp {
            width: 100%;
            border-collapse: collapse;
            margin: 3px 0 6px;
            font-size: 8.5px;
        }
        .cmp th, .cmp td {
            padding: 2.5px 5px;
            border: 1px solid #cbd5e1;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .cmp th { background: #1e293b; color: #f8fafc; font-family: 'Inter', sans-serif; font-size: 7.5px; text-transform: uppercase; font-weight: 700; }
        .cmp th:first-child, .cmp td:first-child { text-align: left; font-family: 'Inter', sans-serif; }
        .cmp tr.grp-row td {
            background: #e0f2fe !important;
            color: #0369a1;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 7.8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: left;
            padding: 2px 5px;
        }
        .cmp tr.total td { background: #e2e8f0; font-weight: 800; border-top: 1.5px solid #475569; }
        .cmp .pos { color: #15803d; font-weight: 700; }
        .cmp .neg { color: #be123c; font-weight: 700; }
        .cmp .zero { color: #94a3b8; }

        /* ── SCENARIO & BOXES ── */
        .scen-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin: 4px 0;
        }
        .scen-box {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 6px 8px;
            background: #f8fafc;
        }
        .scen-box.curr { border-top: 3px solid #64748b; }
        .scen-box.proposed { border-top: 3px solid #0284c7; background: #f0f9ff; }
        .scen-box h4 {
            margin: 0 0 4px 0;
            font-size: 8.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .scen-box.curr h4 { color: #475569; }
        .scen-box.proposed h4 { color: #0369a1; }
        .scen-box .row {
            display: flex;
            justify-content: space-between;
            padding: 1.5px 0;
            font-size: 8.2px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .scen-box .row.total { font-weight: 800; border-top: 1.5px solid #94a3b8; border-bottom: none; margin-top: 3px; padding-top: 3px; font-size: 9px; }

        /* ── RECOMMENDATIONS & STEPS ── */
        .reco {
            border-left: 3.5px solid;
            padding: 5px 9px;
            margin: 3.5px 0;
            border-radius: 3px;
            background: #f8fafc;
            font-size: 8.8px;
            line-height: 1.42;
            border-top: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }
        .reco.info { border-left-color: #0284c7; background: #f0f9ff; }
        .reco.warn { border-left-color: #d97706; background: #fffbeb; }
        .reco.danger { border-left-color: #be123c; background: #fef2f2; }
        .reco.success { border-left-color: #047857; background: #f0fdf4; }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 6px 0;
        }
        .step-card {
            border: 1px solid #cbd5e1;
            border-top: 3px solid #0284c7;
            border-radius: 4px;
            padding: 5px 7px;
            background: #f8fafc;
            font-size: 8px;
            line-height: 1.35;
        }
        .step-card .step-num {
            font-weight: 800;
            color: #0284c7;
            text-transform: uppercase;
            font-size: 8px;
            margin-bottom: 2px;
        }

        /* ── SIGNATURE BLOCK ── */
        .sig {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
        }
        .sig div {
            border-top: 1.5px solid #475569;
            padding-top: 4px;
            text-align: center;
            font-size: 8.5px;
            color: #334155;
        }

        footer.page-footer {
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            font-size: 7.5px;
            color: #64748b;
            font-family: 'JetBrains Mono', monospace;
        }

        .landscape-inner { display: block; }

        @media print {
            html, body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .toolbar { display: none !important; }
            @page { size: A4 portrait; margin: 0; }

            .page {
                width: 210mm !important;
                height: 297mm !important;
                min-height: 0 !important;
                max-width: 210mm !important;
                max-height: 297mm !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                position: relative;
                overflow: hidden !important;
                page-break-after: always;
                page-break-inside: avoid;
                contain: paint;
            }
            .page:last-of-type { page-break-after: auto; }

            .page.portrait {
                padding: 10mm 12mm !important;
            }
            .page.portrait .landscape-inner {
                position: static;
                transform: none;
                width: 100%;
                height: 100%;
                padding: 0;
            }

            .page:not(.portrait) .landscape-inner {
                position: absolute;
                top: 0;
                left: 0;
                width: 273mm;
                height: 186mm;
                padding: 8mm 10mm;
                box-sizing: border-box;
                background: white;
                transform: translate(198mm, 12mm) rotate(90deg);
                transform-origin: top left;
                page-break-inside: avoid;
            }

            .landscape-inner table { page-break-inside: avoid; break-inside: avoid; }
            .landscape-inner tr { page-break-inside: avoid; break-inside: avoid; }
            .page.portrait table { page-break-inside: auto; }
            .page.portrait tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
    </style>
</head>
<body>

    <!-- TOOLBAR (skryto při tisku) -->
    <div class="toolbar no-print">
        <fieldset>
            <legend>Tisknuté sekce klientské sestavy</legend>
            <div class="checks">
                <label><input type="checkbox" id="chkCover" checked onchange="render()"> 1. Titulní strana & Rozcestník smluv</label>
                <label><input type="checkbox" id="chkBrief" checked onchange="render()"> Zadání & Stanovisko poradce</label>
                <label><input type="checkbox" id="chkCurrent" checked onchange="render()"> 2. Stávající portfolio</label>
                <label><input type="checkbox" id="chkProposed" checked onchange="render()"> 3. Navrhované portfolio</label>
                <label><input type="checkbox" id="chkCompare" checked onchange="render()"> 4. Srovnání & Scénář plnění</label>
                <label><input type="checkbox" id="chkReco" checked onchange="render()"> 5. Harmonogram změn & Podpisy</label>
            </div>
        </fieldset>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <label style="font-size:11px;font-weight:600;color:#334155">
                    Sloupce v tabulkách:
                    <select id="printColMode" onchange="render()">
                        <option value="active" selected>Pouze sjednaná a klíčová rizika (vysoká čitelnost)</option>
                        <option value="core">Hlavních 17 pilířů</option>
                        <option value="all">Všech 32 druhů pojištění</option>
                    </select>
                </label>
                <label style="font-size:11px;font-weight:600;color:#334155">
                    Srovnání na str. 4 pro:
                    <select id="printPersonFilter" onchange="render()">
                        <option value="ALL">Celá rodina (souhrn)</option>
                    </select>
                </label>
            </div>
            <div style="display:flex;gap:6px">
                <button onclick="window.close()">✕ Zavřít náhled</button>
                <button onclick="window.print()" class="primary">⎙ Vytisknout / Uložit PDF</button>
            </div>
        </div>
    </div>

    <div id="printRoot"></div>

    <script>
    /* ════════════════════════════════════════════════════════════════════
       tisk.html — Klientská tisková sestava s jednoznačnou identifikací
       modelace finančního poradce, rozcestníkem smluv a srovnáním po osobách.
       ════════════════════════════════════════════════════════════════════ */
    const D = window.INSURANCE_DATA;
    const STORAGE_KEY = 'insurance_compare_data';
    const DEFAULT_LOGO_URL = 'https://martin-cht.github.io/pojisteni/soubory/logo.png';

    function getCookie(name) {
        try {
            const m = document.cookie.split('; ').find(r => r.startsWith(name + '='));
            return m ? decodeURIComponent(m.split('=')[1]) : '';
        } catch (e) { return ''; }
    }

    let state = {
        clients: [], currentContracts: [], proposedContracts: [], loans: [],
        scenario: {}, adviserBrief: '', advisorRecommendation: '',
        advisorName: '', advisorCompany: '', advisorIco: '', advisorPhone: '', advisorEmail: '',
        modelId: 'MOD-2026-01', logoUrl: ''
    };
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}

    if (!state.advisorName)    state.advisorName    = getCookie('insurance_advisor_name') || '';
    if (!state.advisorCompany || state.advisorCompany === 'Finanční & Pojistné Poradenství') {
        state.advisorCompany = getCookie('insurance_advisor_company') || 'MyPlans';
    }
    if (!state.advisorIco)     state.advisorIco     = getCookie('insurance_advisor_ico') || '';
    if (!state.advisorPhone)   state.advisorPhone   = getCookie('insurance_advisor_phone') || '';
    if (!state.advisorEmail)   state.advisorEmail   = getCookie('insurance_advisor_email') || '';
    if (!state.modelId)        state.modelId        = getCookie('insurance_model_id') || 'MOD-2026-01';
    if (!state.logoUrl)        state.logoUrl        = getCookie('insurance_logo_url') || DEFAULT_LOGO_URL;

    /* Populate person filter in toolbar */
    const pfSel = document.getElementById('printPersonFilter');
    if (pfSel && state.clients && state.clients.length) {
        pfSel.innerHTML = '<option value="ALL">Celá rodina (souhrn)</option>' +
            state.clients.map(c => `<option value="${c.id}">Osoba: ${esc(c.name)}</option>`).join('');
    }

    function num(v) { v = parseFloat(v); return isNaN(v) ? 0 : v; }
    function fmtCZK(n) { return Math.round(num(n)).toLocaleString('cs-CZ', { maximumFractionDigits: 0 }) + ' Kč'; }
    function fmtCZKShort(n) {
        n = num(n);
        if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
        if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + 'k';
        return Math.round(n) + '';
    }
    function fmtCatValue(v, cat) {
        v = num(v);
        if (!v) return '—';
        if (cat.kind === 'daily') return v.toLocaleString('cs-CZ') + ' Kč/d';
        if (cat.kind === 'monthly') return v.toLocaleString('cs-CZ') + ' Kč/m';
        return fmtCZK(v);
    }
    function fmtCatShort(v, cat) {
        v = num(v);
        if (!v) return '·';
        if (cat.kind === 'daily') return v + '/d';
        if (cat.kind === 'monthly') return fmtCZKShort(v) + '/m';
        return fmtCZKShort(v);
    }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function clientName(id) {
        const c = (state.clients || []).find(c => c.id === id);
        return c ? c.name : '(nepřiřazeno)';
    }
    function advisorName() { return (state.advisorName || '').trim() || 'Finanční a pojistný poradce'; }
    function advisorFullLine() {
        const parts = [advisorName()];
        if (state.advisorCompany && state.advisorCompany.trim()) parts.push(state.advisorCompany.trim());
        if (state.advisorIco && state.advisorIco.trim()) parts.push(state.advisorIco.trim());
        return parts.join(' · ');
    }
    function advisorContactLine() {
        const parts = [];
        if (state.advisorPhone && state.advisorPhone.trim()) parts.push('Tel: ' + state.advisorPhone.trim());
        if (state.advisorEmail && state.advisorEmail.trim()) parts.push(state.advisorEmail.trim());
        return parts.join(' · ');
    }
    function logoHtml() {
        const url = (state.logoUrl || '').trim();
        if (!url) return '';
        return `<img src="${esc(url)}" alt="Logo" class="logo-img" onerror="this.style.display='none'">`;
    }

    function premMonthly(c) {
        const f = c.conditions && c.conditions.paymentFrequency;
        const p = num(c.premium);
        if (f === 'yearly') return p / 12;
        if (f === 'quarterly') return p / 3;
        if (f === 'singlepay') return 0;
        return p;
    }
    function sumPrem(list) { return (list || []).reduce((s, c) => s + premMonthly(c), 0); }
    function sumItem(list, key) { return (list || []).reduce((s, c) => s + num(c.items && c.items[key]), 0); }
    function sumItemFor(list, cid, key) { return (list || []).filter(c => c.clientId === cid).reduce((s, c) => s + num(c.items && c.items[key]), 0); }
    function sumLoans() { return (state.loans || []).reduce((s, l) => s + num(l.amount), 0); }

    function statusBadgeHtml(c, which) {
        const list = D.CONTRACT_ACTIONS[which] || [];
        const key = which === 'current' ? (c.actionStatus || 'keep') : (c.proposalStatus || 'new');
        const found = list.find(a => a.key === key) || list[0];
        return `<span class="st-badge ${found.printCls}">${esc(found.short)}</span>`;
    }

    function getPrintCategories() {
        const mode = document.getElementById('printColMode')?.value || 'active';
        if (mode === 'all') return D.CATEGORIES;
        if (mode === 'core') return D.CATEGORIES.filter(c => c.core);
        const baseKeys = new Set(['smrt', 'smrtKles', 'invalidita', 'inv2', 'inv1', 'zavOn', 'tnUraz', 'uraz', 'hosp', 'pn28']);
        return D.CATEGORIES.filter(c =>
            baseKeys.has(c.key) ||
            sumItem(state.currentContracts, c.key) > 0 ||
            sumItem(state.proposedContracts, c.key) > 0
        );
    }

    function buildHeaderHtml(subTitle, today) {
        const contact = advisorContactLine();
        return `
            <div class="letterhead">
                <div class="brand-with-logo">
                    ${logoHtml()}
                    <div class="brand">
                        Modelace a srovnání životního pojištění
                        <span class="sub">${esc(subTitle)}</span>
                    </div>
                </div>
                <div class="meta">
                    <span class="model-id">ID MODELACE: ${esc(state.modelId || 'MOD-2026-01')}</span> · Datum: <strong>${today}</strong><br>
                    Zpracoval: <strong>${esc(advisorFullLine())}</strong>
                    ${contact ? `<br>${esc(contact)}` : ''}
                </div>
            </div>
        `;
    }

    function buildFooterHtml(pageLabel) {
        return `
            <footer class="page-footer">
                <span>Modelace: ${esc(state.modelId || 'MOD-2026-01')} · Zpracoval: ${esc(advisorName())}</span>
                <span>Klient: ${esc(state.clients[0]?.name || 'Rodinné portfolio')}</span>
                <span>${esc(pageLabel)}</span>
            </footer>
        `;
    }

    /* ─────────────────────────────────────────────────────────────────
       HLAVNÍ RENDER
       ───────────────────────────────────────────────────────────────── */
    function render() {
        const root = document.getElementById('printRoot');
        root.innerHTML = '';
        const chk = id => { const e = document.getElementById(id); return e ? e.checked : true; };
        const showBrief = chk('chkBrief');
        const today = new Date().toLocaleDateString('cs-CZ', { day: 'numeric', month: 'long', year: 'numeric' });
        const curM = sumPrem(state.currentContracts);
        const newM = sumPrem(state.proposedContracts);
        const diffM = newM - curM;

        if (chk('chkCover'))    root.appendChild(buildPage1(today, curM, newM, diffM, showBrief));
        if (chk('chkCurrent'))  root.appendChild(buildPortfolioPage(state.currentContracts, 'current', '2. Stávající portfolio pojištění (Audit smluv)', 'Přehled aktuálně sjednaných smluv klienta s vyznačeným doporučením finančního poradce u každé smlouvy.', today));
        if (chk('chkProposed')) root.appendChild(buildPortfolioPage(state.proposedContracts, 'proposed', '3. Navrhované portfolio pojištění (Modelace poradce)', 'Cílové nastavení pojištění po optimalizaci — kombinace zachovaných smluv a nově navrženého řešení.', today));
        if (chk('chkCompare'))  root.appendChild(buildComparePage(today, curM, newM, diffM));
        if (chk('chkReco'))     root.appendChild(buildRecoPage(today, curM, newM, diffM));
    }

    /* STRANA 1: TITULNÍ STRANA, STANOVISKO PORADCE, PŘEHLED PO OSOBÁCH A ROZCESTNÍK SMLUV */

            </tr>`),

                <td><strong>${esc(clientName(c.clientId))}</strong></td>
                <td><strong>${esc(c.insurer || '—')}</strong> <span style="font-family:'JetBrains Mono',monospace;color:#0369a1">(${esc(c.contractNo || 'NÁVRH')})</span></td>
                <td class="num"><strong>${fmtCZK(premMonthly(c))}</strong></td>
                <td>${statusBadgeHtml(c, 'proposed')}</td>
                <td style="font-size:8px;color:#075985;font-weight:500">${esc(c.actionReason || c.note || 'Nově navržená smlouva dle modelace poradce')}</td>
            </tr>`)
        ].join('');

        p.innerHTML = `
            ${buildHeaderHtml('Manažerské shrnutí a rozcestník smluv pro klienta', today)}

            <h1 class="doc-title">Osobní modelace a srovnání životního pojištění</h1>
            <p class="doc-subtitle">Připraveno pro: <strong>${esc(state.clients.length ? state.clients.map(c => c.name).join(', ') : 'Klient')}</strong></p>

            ${showBrief && state.adviserBrief ? `

            <div class="kpi-row">

                    <div class="sub">${fmtCZK(curM * 12)} / rok (${state.currentContracts.length} sml.)</div>

                <div class="kpi prop">
                    <div class="lbl">Návrh poradce</div>
                    <div class="val">${fmtCZK(newM)} / měs</div>
                    <div class="sub">${fmtCZK(newM * 12)} / rok (${state.proposedContracts.length} sml.)</div>
                </div>
                <div class="kpi ${diffM > 0 ? 'diff-neg' : 'diff-pos'}">
                    <div class="lbl">Rozdíl v platbě (Δ)</div>
                    <div class="val">${diffM >= 0 ? '+' : ''}${fmtCZK(diffM)} / měs</div>
                    <div class="sub">${diffM >= 0 ? '+' : ''}${fmtCZK(diffM * 12)} / rok</div>
                </div>
                <div class="kpi">
                    <div class="lbl">Úvěry a závazky rodiny</div>
                    <div class="val">${fmtCZKShort(loanTotal)} Kč</div>

                <div class="kpi">
                    <div class="lbl">Krytí smrti (Dnes → Návrh)</div>
                    <div class="val">${fmtCZKShort(curDeath)} → ${fmtCZKShort(newDeath)}</div>
                    <div class="sub">${newDeath >= loanTotal ? '✔ 100 % úvěrů zajištěno' : 'Částečné krytí'}</div>

                <div class="kpi score">
                    <div class="lbl">Invalidita III. st. (Dnes → Návrh)</div>

            <h2 class="section"><span>2. Přehled hlavních pilířů pojištění po jednotlivých osobách (Dnes → Návrh poradce)</span></h2>
            <table class="t">

            <h2 class="section"><span>3. Rozcestník smluv dle doporučení poradce (Co ponechat, co vypovědět a co sjednat)</span></h2>

            <table class="t">

                </thead>
                <tbody>
                    ${(state.loans || []).map(l => `<tr>
                        <td><strong>${esc(l.name)}</strong></td>
                        <td>${esc(clientName(l.linkedClientId))}</td>

                ${(state.loans || []).length ? `<tfoot>

                </tfoot>` : ''}

            ${buildFooterHtml('Strana 1 / 5 — Přehled a rozcestník smluv')}
        `;
        return p;
    }

    /* STRANA 2 & 3: DETAILNÍ TABULKY PORTFOLIA (STÁVAJÍCÍ / NÁVRH) */
    function buildPortfolioPage(list, which, title, subtitle, today) {
        const p = document.createElement('div');
        p.className = 'page';
        const visCats = getPrintCategories();

        const blocks = (state.clients || []).map(person => {
            const items = (list || []).filter(c => c.clientId === person.id);
            if (!items.length) return '';
            const personPrem = items.reduce((s, c) => s + premMonthly(c), 0);

            const rows = items.map(c => {
                const prog = c.conditions && c.conditions.tnProgression ? `TN ${c.conditions.tnProgression}%` : '';
                const retro = c.conditions && c.conditions.pnRetroactive ? 'PN zpětně' : '';
                const tags = [prog, retro].filter(Boolean).join(', ');
                return `
                <tr>
                    <td class="meta">
                        <div class="insurer">${esc(c.insurer || '—')} ${tags ? `<span style="font-weight:400;color:#0284c7;font-size:7px">[${esc(tags)}]</span>` : ''}</div>
                        <div class="cno">${esc(c.contractNo || '—')}${c.start || c.end ? ` · ${c.start || '?'}–${c.end || '?'}` : ''}</div>
                        ${(c.actionReason || c.note) ? `<div class="note">${esc(c.actionReason || c.note)}</div>` : ''}
                    </td>
                    <td>${statusBadgeHtml(c, which)}</td>
                    ${visCats.map(cat => {
                        const v = num(c.items && c.items[cat.key]);
                        if (!v) return `<td class="dash">·</td>`;
                        return `<td class="num">${fmtCatShort(v, cat)}</td>`;
                    }).join('')}
                    <td class="num"><strong>${fmtCZK(premMonthly(c))}</strong></td>
                </tr>`;
            }).join('');

            const totals = visCats.map(cat => {
                const v = sumItemFor(list, person.id, cat.key);
                if (!v) return `<td class="dash">·</td>`;
                return `<td class="num">${fmtCatShort(v, cat)}</td>`;
            }).join('');

            return `
                <h3 class="subsec">
                    <span>👤 ${esc(person.name)} (${items.length} sml.)</span>
                    <span>Součet pojistného: ${fmtCZK(personPrem)} / měs (${fmtCZK(personPrem * 12)} / rok)</span>
                </h3>
                <table class="t wide">
                    <thead>
                        <tr>
                            <th style="width:22%">Pojišťovna, č. smlouvy & zdůvodnění</th>
                            <th style="width:8%">Doporučení</th>
                            ${visCats.map(c => `<th class="num" title="${esc(c.label)}">${esc(c.mini)}</th>`).join('')}
                            <th class="num" style="width:7%">Platba/měs</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2">Celkem za osobu: ${esc(person.name)}</td>
                            ${totals}
                            <td class="num">${fmtCZK(personPrem)}</td>
                        </tr>
                    </tfoot>
                </table>
            `;
        }).filter(Boolean).join('');

        const totalAll = sumPrem(list);

        p.innerHTML = `
            <div class="landscape-inner">
                ${buildHeaderHtml(title, today)}
                <div style="display:flex;justify-content:space-between;align-items:baseline">
                    <div>
                        <h1 class="doc-title">${esc(title)}</h1>
                        <p class="doc-subtitle">${esc(subtitle)}</p>
                    </div>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;color:#0f172a;background:#f1f5f9;padding:4px 10px;border-radius:4px;border:1px solid #cbd5e1">
                        Celkem portfolio: ${fmtCZK(totalAll)} / měs (${fmtCZK(totalAll * 12)} / rok)
                    </div>
                </div>

                <div style="font-size:7.8px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;padding:3px 7px;border-radius:3px;margin-bottom:4px">
                    <strong>Vysvětlivky sloupců:</strong>
                    ${visCats.map(c => `<span style="margin-right:7px"><strong>${esc(c.mini)}</strong> = ${esc(c.label)}</span>`).join('')}
                    <span style="color:#64748b">(M = mil. Kč, k = tis. Kč, /d = Kč za den, /m = Kč za měsíc)</span>
                </div>

                ${blocks || '<p style="font-style:italic;color:#94a3b8">Žádné smlouvy v této sekci.</p>'}

                ${buildFooterHtml(which === 'current' ? 'Strana 2 / 5 — Stávající portfolio' : 'Strana 3 / 5 — Navrhované portfolio')}
            </div>
        `;
        return p;
    }

    /* STRANA 4: POLOŽKOVÉ SROVNÁNÍ PO SKUPINÁCH + MODELOVÝ SCÉNÁŘ + PROGRESE TN */
    function buildComparePage(today, curM, newM, diffM) {
        const p = document.createElement('div');
        p.className = 'page';
        const pFilter = document.getElementById('printPersonFilter')?.value || 'ALL';
        const filterList = list => pFilter === 'ALL' ? list : (list || []).filter(c => c.clientId === pFilter);
        const curList = filterList(state.currentContracts);
        const newList = filterList(state.proposedContracts);
        const filterLabel = pFilter === 'ALL' ? 'Celá rodina (souhrn všech osob)' : `Osoba: ${clientName(pFilter)}`;

        const visCats = getPrintCategories();
        let rowsHtml = '';
        D.CATEGORY_GROUPS.forEach(grp => {
            const grpCats = visCats.filter(c => c.group === grp.key);
            if (!grpCats.length) return;
            rowsHtml += `<tr class="grp-row"><td colspan="5">${esc(grp.label)}</td></tr>`;
            grpCats.forEach(cat => {
                const cv = sumItem(curList, cat.key);
                const nv = sumItem(newList, cat.key);
                if (cv === 0 && nv === 0 && !['smrt', 'invalidita', 'zavOn', 'tnUraz', 'pn28'].includes(cat.key)) return;
                const diff = nv - cv;
                const cls = diff > 0 ? 'pos' : diff < 0 ? 'neg' : 'zero';
                let verdict = 'Beze změny';
                if (cv === 0 && nv > 0) verdict = '★ Nově doplněno';
                else if (diff > 0)      verdict = '▲ Posíleno';
                else if (cv > 0 && nv === 0) verdict = 'Odebráno';
                else if (diff < 0)      verdict = 'Sníženo';
                else if (cv > 0)        verdict = '● Zachováno';

                rowsHtml += `<tr>
                    <td><strong>${esc(cat.label)}</strong></td>
                    <td>${fmtCatValue(cv, cat)}</td>
                    <td style="font-weight:700;color:#0369a1">${fmtCatValue(nv, cat)}</td>
                    <td class="${cls}">${diff === 0 ? '±0' : (diff > 0 ? '+' : '') + fmtCatValue(diff, cat)}</td>
                    <td style="font-family:'Inter',sans-serif;font-size:7.5px;text-align:center" class="${cls}">${verdict}</td>
                </tr>`;
            });
        });

        const fCurM = sumPrem(curList);
        const fNewM = sumPrem(newList);
        const fDiffM = fNewM - fCurM;

        /* Scénář plnění */
        const sc = state.scenario || { pnDays: 90, hospDays: 5, ocrDays: 0, injury: 'minor', retroactive: true, tnDamagePct: 35 };
        const person = (pFilter !== 'ALL' ? state.clients.find(c => c.id === pFilter) : state.clients.find(c => c.id === sc.person)) || state.clients[0];

        let scenHtml = '';
        if (person) {
            const pCurItems = state.currentContracts.filter(c => c.clientId === person.id);
            const pNewItems = state.proposedContracts.filter(c => c.clientId === person.id);
            const pnDays = num(sc.pnDays) || 90;
            const hospDays = num(sc.hospDays) || 5;

            const calcBox = (items, useRetroDefault) => {
                const s = k => items.reduce((acc, c) => acc + num(c.items && c.items[k]), 0);
                const hasRetro = useRetroDefault || items.some(c => c.conditions && c.conditions.pnRetroactive);
                const dou = s('uraz') * pnDays;
                const urV = s('urazVelky') * Math.max(0, pnDays - 28);
                const hosp = (s('hosp') + s('hospUraz')) * hospDays;
                const pn28 = hasRetro ? (pnDays >= 29 ? s('pn28') * pnDays : 0) : s('pn28') * Math.max(0, pnDays - 28);
                const pn61 = hasRetro ? (pnDays >= 61 ? s('pn61') * pnDays : 0) : s('pn61') * Math.max(0, pnDays - 60);
                const chir = s('chir');
                const list = [
                    { l: `Denní odškodné úrazu (${pnDays} d)`, v: dou },
                    { l: `Vážný úraz nad 28 dní`, v: urV },
                    { l: `Hospitalizace (${hospDays} d)`, v: hosp },
                    { l: `Pracovní neschopnost PN 29.${hasRetro ? ' (zpětně)' : ''}`, v: pn28 },
                    { l: `Pracovní neschopnost PN 61.${hasRetro ? ' (zpětně)' : ''}`, v: pn61 },
                    { l: `Chirurgický zákrok`, v: chir }
                ].filter(x => x.v > 0);
                const tot = list.reduce((a, b) => a + b.v, 0);
                return { list, tot };
            };

            const curSc = calcBox(pCurItems, false);
            const newSc = calcBox(pNewItems, true);
            const diffSc = newSc.tot - curSc.tot;

            /* Ukázka progrese TN pro danou osobu */
            const curTnBase = sumItemFor(state.currentContracts, person.id, 'tnUraz') + sumItemFor(state.currentContracts, person.id, 'tnUraz10');
            const newTnBase = sumItemFor(state.proposedContracts, person.id, 'tnUraz') + sumItemFor(state.proposedContracts, person.id, 'tnUraz10');
            const curProg = pCurItems.length ? Math.max(...pCurItems.map(c => num(c.conditions && c.conditions.tnProgression) || 400)) : 400;
            const newProg = pNewItems.length ? Math.max(...pNewItems.map(c => num(c.conditions && c.conditions.tnProgression) || 800)) : 800;

            /* Bilance v PN (ČSSZ 2026) */
            const netInc = D.computeNetIncome(person.incomeGross, person.isEntrepreneur);
            const sick = D.computeExactSickLeave(person.incomeGross, person.isEntrepreneur, 60);
            const newPnMonthly = (sumItemFor(state.proposedContracts, person.id, 'pn15') + sumItemFor(state.proposedContracts, person.id, 'pn28') + sumItemFor(state.proposedContracts, person.id, 'pn61')) * 30;

            scenHtml = `
                <div style="font-size:8.5px;color:#334155;margin-bottom:4px">
                    Modelovaná osoba: <strong>${esc(person.name)}</strong> · Událost: <strong>${pnDays} dní léčení / PN</strong>, <strong>${hospDays} dní v nemocnici</strong> + chirurgický zákrok.
                </div>
                <div class="scen-grid">
                    <div class="scen-box curr">
                        <h4>Stávající plnění</h4>
                        ${curSc.list.map(x => `<div class="row"><span>${esc(x.l)}</span><span>${fmtCZK(x.v)}</span></div>`).join('') || '<div class="row"><span>Žádné plnění</span><span>0 Kč</span></div>'}
                        <div class="row total"><span>Celkem ze stávajícího</span><span>${fmtCZK(curSc.tot)}</span></div>
                    </div>
                    <div class="scen-box proposed">
                        <h4>Plnění dle Návrhu poradce</h4>
                        ${newSc.list.map(x => `<div class="row"><span>${esc(x.l)}</span><span><strong>${fmtCZK(x.v)}</strong></span></div>`).join('') || '<div class="row"><span>Žádné plnění</span><span>0 Kč</span></div>'}
                        <div class="row total"><span>Celkem z návrhu</span><span style="color:#0369a1">${fmtCZK(newSc.tot)}</span></div>
                    </div>
                </div>
                <div style="text-align:right;font-size:8.8px;font-weight:700;color:#15803d;margin-bottom:8px">
                    Přínos návrhu při této události: ${diffSc >= 0 ? '+' : ''}${fmtCZK(diffSc)}
                </div>

                <h2 class="section"><span>Efekt progrese u trvalých následků úrazu (${esc(person.name)})</span></h2>
                <table class="t">
                    <thead>
                        <tr>
                            <th>Varianta</th>
                            <th class="num">Základ TN</th>
                            <th class="num">Progrese</th>
                            <th class="num">Při 25 % TN</th>
                            <th class="num">Při 50 % TN</th>
                            <th class="num">Při 100 % TN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Stávající</td>
                            <td class="num">${fmtCZKShort(curTnBase)}</td>
                            <td class="num">${curProg} %</td>
                            <td class="num">${fmtCZKShort(Math.round(curTnBase * D.computeTnProgressionMultiplier(25, curProg)))}</td>
                            <td class="num">${fmtCZKShort(Math.round(curTnBase * D.computeTnProgressionMultiplier(50, curProg)))}</td>
                            <td class="num">${fmtCZKShort(Math.round(curTnBase * D.computeTnProgressionMultiplier(100, curProg)))}</td>
                        </tr>
                        <tr style="background:#f0f9ff;font-weight:700">
                            <td>Návrh poradce</td>
                            <td class="num">${fmtCZKShort(newTnBase)}</td>
                            <td class="num">${newProg} %</td>
                            <td class="num" style="color:#0369a1">${fmtCZKShort(Math.round(newTnBase * D.computeTnProgressionMultiplier(25, newProg)))}</td>
                            <td class="num" style="color:#0369a1">${fmtCZKShort(Math.round(newTnBase * D.computeTnProgressionMultiplier(50, newProg)))}</td>
                            <td class="num" style="color:#0369a1">${fmtCZKShort(Math.round(newTnBase * D.computeTnProgressionMultiplier(100, newProg)))}</td>
                        </tr>
                    </tbody>
                </table>

                ${netInc > 0 ? `
                    <h2 class="section"><span>Měsíční bilance příjmu v dlouhodobé PN (${esc(person.name)})</span></h2>
                    <div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:4px;padding:6px 8px;font-size:8.2px">
                        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span>Čistý měsíční příjem:</span><strong>${fmtCZK(netInc)}</strong></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span>Státní nemocenská ČSSZ (2026):</span><span>${fmtCZK(sick.monthlyAvg)} / měs</span></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:2px"><span>Výplata z navrženého pojištění (30 dní):</span><strong style="color:#0369a1">+${fmtCZK(newPnMonthly)} / měs</strong></div>
                        <div style="display:flex;justify-content:space-between;border-top:1px solid #cbd5e1;padding-top:3px;margin-top:2px;font-weight:800">
                            <span>Celkový měsíční příjem v PN (Stát + Návrh):</span>
                            <span style="color:#15803d">${fmtCZK(sick.monthlyAvg + newPnMonthly)} / měs (${Math.round((sick.monthlyAvg + newPnMonthly) / netInc * 100)} % čistého příjmu)</span>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        p.innerHTML = `
            <div class="landscape-inner">
                ${buildHeaderHtml('4. Položkové srovnání pojistného krytí a modelové plnění', today)}
                <h1 class="doc-title">Detailní srovnání: Stávající stav × Návrh poradce (${esc(filterLabel)})</h1>
                <p class="doc-subtitle">Přehled změn v pojistných částkách a denních dávkách podle jednotlivých skupin rizik.</p>

                <div style="display:grid;grid-template-columns:1.18fr 0.82fr;gap:12px">
                    <div>
                        <table class="cmp">
                            <thead>
                                <tr>
                                    <th>Pojistné riziko / kategorie</th>
                                    <th>Stávající</th>
                                    <th>Návrh poradce</th>
                                    <th>Rozdíl (Δ)</th>
                                    <th style="text-align:center">Změna</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                            <tfoot>
                                <tr class="total">
                                    <td>Měsíční pojistné (${esc(filterLabel)})</td>
                                    <td>${fmtCZK(fCurM)}</td>
                                    <td>${fmtCZK(fNewM)}</td>
                                    <td class="${fDiffM > 0 ? 'neg' : fDiffM < 0 ? 'pos' : 'zero'}">${fDiffM === 0 ? '±0' : (fDiffM > 0 ? '+' : '') + fmtCZK(fDiffM)}</td>
                                    <td style="text-align:center">${fmtCZK(fNewM * 12)}/rok</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div>
                        <h2 class="section" style="margin-top:0"><span>Modelový scénář pojistného plnění</span></h2>
                        ${scenHtml}
                    </div>
                </div>

                ${buildFooterHtml('Strana 4 / 5 — Srovnání a modelové scénáře')}
            </div>
        `;
        return p;
    }

    /* STRANA 5: DOPORUČENÍ PORADCE, BEZPEČNÝ POSTUP KROK ZA KROKEM & PODPISOVÝ BLOK */
    function buildRecoPage(today, curM, newM, diffM) {
        const p = document.createElement('div');
        p.className = 'page portrait';
        const recos = computeRecommendations(curM, newM, diffM);

        const keptList = (state.currentContracts || []).filter(c => c.actionStatus === 'keep' || c.actionStatus === 'modify');
        const cancelList = (state.currentContracts || []).filter(c => c.actionStatus === 'cancel' || c.actionStatus === 'consolidate');
        const newList = (state.proposedContracts || []).filter(c => c.proposalStatus === 'new');

        p.innerHTML = `
            ${buildHeaderHtml('5. Závěrečné vyhodnocení, postup realizace a záznam z jednání', today)}
            <h1 class="doc-title">Shrnutí doporučení finančního poradce a postup realizace</h1>
            <p class="doc-subtitle">Přehled klíčových argumentů modelace a bezpečný harmonogram přechodu na nové pojistné portfolio.</p>

            ${state.advisorRecommendation ? `
                <div class="advisor-hero">
                    <div class="hero-title">
                        <span>Celkové odborné stanovisko poradce (${esc(advisorName())})</span>
                        <span>ID: ${esc(state.modelId || 'MOD-2026-01')}</span>
                    </div>
                    <div class="hero-body">${esc(state.advisorRecommendation)}</div>
                </div>
            ` : ''}

            <h2 class="section"><span>1. Klíčová zjištění z auditu portfolia</span></h2>
            ${recos.map(r => `<div class="reco ${r.type}">${r.text}</div>`).join('')}

            <h2 class="section"><span>2. Bezpečný postup realizace změn krok za krokem (Ochrana před čekací dobou)</span></h2>
            <div class="steps-grid">
                <div class="step-card">
                    <div class="step-num">Krok 1 · Ponechané smlouvy</div>
                    <strong>Nerušit ponechané smlouvy (${keptList.length}×):</strong>
                    Smlouvy označené jako <em>PONECHAT</em> (${keptList.map(c => esc(c.contractNo || c.insurer)).join(', ') || '—'}) zůstávají v plné platnosti kvůli zachování historických podmínek a zdravotního stavu.
                </div>
                <div class="step-card">
                    <div class="step-num">Krok 2 · Sjednání návrhu</div>
                    <strong>Podpis a ocenění nové smlouvy (${newList.length}×):</strong>
                    Sjednáme nově navržené smlouvy (${newList.map(c => esc(c.insurer)).join(', ') || 'dle návrhu'}) a vyčkáme na potvrzení pojišťovny o přijetí do pojištění (vydání pojistky).
                </div>
                <div class="step-card">
                    <div class="step-num">Krok 3 · Výpověď rušených</div>
                    <strong>Ukončení překonaných smluv (${cancelList.length}×):</strong>
                    Teprve <strong>po přijetí nové smlouvy</strong> podáme výpověď smluv určených ke zrušení (${cancelList.map(c => esc(c.contractNo || c.insurer)).join(', ') || '—'}). Tím eliminujeme riziko nepojištěného období.
                </div>
                <div class="step-card">
                    <div class="step-num">Krok 4 · Platby a benefity</div>
                    <strong>Nastavení plateb a příspěvků:</strong>
                    Upravíme trvalé příkazy v bance, zaevidujeme případný příspěvek zaměstnavatele a daňově uznatelné složky (LTC / spoření na stáří).
                </div>
            </div>

            <h2 class="section"><span>3. Informace pro klienta a potvrzení o převzetí modelace (§ 79 zákona č. 170/2018 Sb.)</span></h2>
            <p style="font-size:8.5px;color:#334155;line-height:1.5;margin:4px 0">
                Klient potvrzuje, že byl finančním poradcem seznámen se srovnáním stávajícího a navrhovaného pojistného portfolia, s dopadem navrhovaných změn na rozsah pojistného krytí, s výší pojistného a s pravidly čekacích dob u nově sjednávaných smluv. Pokud se v rámci modelace zachovávají vybrané původní smlouvy z důvodu zdravotní historie klienta, klient bere na vědomí doporučení poradce do těchto smluv nezasahovat.
            </p>
            <p style="font-size:8px;color:#64748b;line-height:1.45;margin:4px 0">
                <strong>Právní upozornění:</strong> Tato modelace vychází z údajů poskytnutých klientem ke dni ${today} a slouží jako analytický podklad k Záznamu z jednání podle § 79 zákona č. 170/2018 Sb., o distribuci pojištění a zajištění. Přesné znění výluk, čekacích dob a oceňovacích tabulek se řídí pojistnou smlouvou a pojistnými podmínkami příslušné pojišťovny.
            </p>

            <div class="sig">
                <div>
                    <strong>${esc(state.clients[0]?.name || 'Klient (pojistník)')}</strong><br>
                    Datum a podpis klienta (převzetí modelace a souhlas s navrženým postupem)
                </div>
                <div>
                    <strong>${esc(advisorFullLine())}</strong><br>
                    Podpis finančního poradce (zpracovatel modelace ${esc(state.modelId || 'MOD-2026-01')})
                </div>
            </div>

            ${buildFooterHtml('Strana 5 / 5 — Doporučení a podpisový blok')}
        `;
        return p;
    }

    function computeRecommendations(curM, newM, diffM) {
        const recos = [];
        const loans = sumLoans();
        const smrtCur = sumItem(state.currentContracts, 'smrt') + sumItem(state.currentContracts, 'smrtKles');
        const smrtNw  = sumItem(state.proposedContracts, 'smrt') + sumItem(state.proposedContracts, 'smrtKles');
        const invCur  = sumItem(state.currentContracts, 'invalidita') + sumItem(state.currentContracts, 'invKles');
        const invNw   = sumItem(state.proposedContracts, 'invalidita') + sumItem(state.proposedContracts, 'invKles');

        if (loans > 0) {
            if (smrtCur < loans) {
                recos.push({ type: 'danger',
                    text: `<strong>Zjištěné podpojištění úvěrů (stávající stav):</strong> Současné krytí smrti (${fmtCZK(smrtCur)}) nepokrývá nesplacené závazky rodiny (${fmtCZK(loans)}) — chybí <strong>${fmtCZK(loans - smrtCur)}</strong>.` });
            }
            if (smrtNw >= loans) {
                recos.push({ type: 'success',
                    text: `<strong>Zajištění závazků v návrhu poradce:</strong> Navržené krytí smrti (${fmtCZK(smrtNw)} v kombinaci konstantní a klesající PČ) plně pokrývá 100 % úvěrů (${fmtCZK(loans)}) a vytváří rezervu pro rodinu.` });
            }
        }
        if (invNw > invCur) {
            recos.push({ type: 'success',
                text: `<strong>Ochrana dlouhodobého příjmu (Invalidita I.–III. stupně):</strong> Krytí invalidity III. stupně se navyšuje z ${fmtCZK(invCur)} na <strong>${fmtCZK(invNw)}</strong> (včetně doplnění krytí pro II. a I. stupeň invalidity).` });
        }
        const kept = (state.currentContracts || []).filter(c => c.actionStatus === 'keep');
        if (kept.length > 0) {
            recos.push({ type: 'info',
                text: `<strong>Respektování zdravotní historie klienta:</strong> Smlouvy ${kept.map(k => `<strong>${esc(k.insurer)} č. ${esc(k.contractNo)}</strong> (${esc(k.actionReason || k.note || 'ponecháno')})`).join('; ')} jsou v nové modelaci <strong>plně zachovány</strong>.` });
        }
        recos.push({ type: diffM > 0 ? 'info' : 'success',
            text: `<strong>Bilance pojistného:</strong> Celkové měsíční pojistné se mění z ${fmtCZK(curM)} na <strong>${fmtCZK(newM)} / měs</strong> (rozdíl ${diffM >= 0 ? '+' : ''}${fmtCZK(diffM)} / měs za plné zajištění hypotéky, invalidity a rodiny).` });

        return recos;
    }

    render();
    </script>
</body>
</html>
